  <defs>
    <style>
      .logo-fill { fill: #6C6C6C; }
      .p1-anim { animation: flip1Once 2.6s cubic-bezier(0.34, 1.25, 0.64, 1) forwards; }
      .p2-anim { animation: flip2Once 2.6s cubic-bezier(0.34, 1.25, 0.64, 1) forwards; }
      .p3-anim { animation: flip3Once 2.6s cubic-bezier(0.34, 1.25, 0.64, 1) forwards; }
      .text-anim { animation: revealWordsOnce 2.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      @keyframes flip1Once {
        0%, 10% { transform: rotate(-20deg); opacity: 0; }
        40%, 100% { transform: rotate(0deg); opacity: 1; }
      }
      @keyframes flip2Once {
        0%, 18% { transform: rotate(-28deg); opacity: 0; }
        52%, 100% { transform: rotate(0deg); opacity: 1; }
      }
      @keyframes flip3Once {
        0%, 26% { transform: rotate(-36deg); opacity: 0; }
        64%, 100% { transform: rotate(0deg); opacity: 1; }
      }
      @keyframes revealWordsOnce {
        0%, 50% { transform: translateX(18px); opacity: 0; }
        80%, 100% { transform: translateX(0); opacity: 1; }
      }
    </style>
