  <defs>
    <style>
      .logo-fill { fill: #6C6C6C; }
      .p1-anim { animation: flip1 3s cubic-bezier(0.34, 1.25, 0.64, 1) infinite; }
      .p2-anim { animation: flip2 3s cubic-bezier(0.34, 1.25, 0.64, 1) infinite; }
      .p3-anim { animation: flip3 3s cubic-bezier(0.34, 1.25, 0.64, 1) infinite; }

      @keyframes flip1 {
        0%, 12% { transform: rotate(-20deg); opacity: 0; }
        34%, 85% { transform: rotate(0deg); opacity: 1; }
        95%, 100% { transform: rotate(-20deg); opacity: 0; }
      }
      @keyframes flip2 {
        0%, 20% { transform: rotate(-28deg); opacity: 0; }
        44%, 85% { transform: rotate(0deg); opacity: 1; }
        95%, 100% { transform: rotate(-28deg); opacity: 0; }
      }
      @keyframes flip3 {
        0%, 28% { transform: rotate(-36deg); opacity: 0; }
        54%, 85% { transform: rotate(0deg); opacity: 1; }
        95%, 100% { transform: rotate(-36deg); opacity: 0; }
      }
    </style>
